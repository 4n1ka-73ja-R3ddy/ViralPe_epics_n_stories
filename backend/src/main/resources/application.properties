# In-Memory Backend Data Architecture Configuration
spring.main.allow-bean-definition-overriding=true

# H2 High-Performance In-Memory Data Store
spring.datasource.url=jdbc:h2:mem:viralpedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# In-Memory JPA & Schema Auto-Generation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway Disk Migrations
spring.flyway.enabled=false

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

