server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/viralpe
    username: viralpe
    password: secret
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    org.springframework: INFO

viralpe:
  frontend:
    url: ${VIRALPE_FRONTEND_URL:http://localhost:3000}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
